# vim:filetype=toml

# themes
[".config/bat/themes"]
type = "archive"
url = "https://github.com/catppuccin/bat/archive/master.tar.gz"
exact = true
stripComponents = 1
refreshPeriod = "168h"
include = ["*/*.tmTheme"]

# icons
[".config/sketchybar-app-font"]
type = "archive"
url = "https://github.com/kvndrsslr/sketchybar-app-font/archive/master.tar.gz"
exact = true
stripComponents = 1
refreshPeriod = "168h"

# spoons
[".hammerspoon/Spoons/EmmyLua.spoon"]
type = "archive"
url = "https://github.com/Hammerspoon/Spoons/raw/master/Spoons/EmmyLua.spoon.zip"
exact = true
stripComponents = 1
refreshPeriod = "168h"
